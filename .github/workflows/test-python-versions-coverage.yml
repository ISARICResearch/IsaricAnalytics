name: Tests (python versions)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:

  test:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        # Note: Latest version is tested by os tests

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          pip install pdm &&\
          pdm install -v -dG "test" --no-editable --no-self &&\
          pdm run -v python -m pytest --code-highlight=yes --color=yes --verbosity=3 -p pytest_cov --cov=isaricanalytics --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
