name: Tests and Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install project and unit test dependencies
        run: |
          python -m pip install uv
          uv sync --verbose --all-groups --no-install-project

      - name: Run doctests (example snippets in docstrings)
        run: |
            uv run python3 -m doctest -v src/isaricanalytics/*.py

      - name: Run pytest with coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          PYTHONPATH="src" uv run python3 -m pytest \
                         --code-highlight=yes \
                         --color=yes \
                         --verbosity=3 \
                         -p pytest_cov \
                         --cov=isaricanalytics \
                         --cov-report=term-missing \
                         --cov-report=xml \
                         --cov-report=html

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage report to Codecov (best effort)
        continue-on-error: true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
