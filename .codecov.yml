coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        flags:
          - unit
        paths:
          - "isaricanalytics"
        branches:
          - main
        if_ci_failed: error
        informational: false
        only_pulls: false
    patch:
      default:
        # Enforce patch coverage on PRs, but do not fail direct commits on main.
        only_pulls: true
        target: 0%

